<!doctype html><html lang="zh"><meta charset="utf-8"><title>dsh-kb</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;font:14px/1.6 system-ui,"Segoe UI",sans-serif;background:#14161a;color:#e6e6e6;height:100vh;display:flex;flex-direction:column}
header{display:flex;gap:16px;align-items:center;padding:8px 14px;border-bottom:1px solid #2a2e36;flex:none}
header b{color:#9cc7ff;font-size:13px}header .tab{padding:5px 10px;border-radius:6px;cursor:pointer;color:#8b96a8}header .tab.on{background:#232833;color:#cfe3ff}
main{flex:1;display:flex;min-height:0}
aside{width:300px;border-right:1px solid #2a2e36;overflow:auto;flex:none;padding:6px 0}
aside input{width:calc(100% - 16px);margin:4px 8px 8px;padding:6px 8px;background:#1b1f26;border:1px solid #333a45;border-radius:6px;color:#fff}
.row{padding:2px 10px;cursor:pointer;color:#c3ccda;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px;display:flex;gap:5px;align-items:center}
.row:hover{background:#1d222b}.row.on{background:#263041;color:#fff}
.arrow{width:12px;flex:none;color:#7d8798;font-size:11px;text-align:center}
.folder{padding-left:10px;border-left:1px solid #232833;margin-left:6px}
#pane{flex:1;display:flex;flex-direction:column;min-width:0}
#bar{display:flex;gap:8px;align-items:center;padding:6px 10px;border-bottom:1px solid #2a2e36;color:#8b96a8;font-size:12px;flex:none}
button{padding:5px 10px;border-radius:6px;border:1px solid #333a45;background:#232833;color:#cfe3ff;cursor:pointer}
textarea{flex:1;width:100%;border:0;background:#14161a;color:#dbe3ef;padding:14px 18px;font:13px/1.7 ui-monospace,Consolas,monospace;resize:none}
#links{flex:none;max-height:30%;overflow:auto;border-top:1px solid #2a2e36;padding:6px 12px;font-size:12px;color:#8b96a8;display:none}
.grp{margin:3px 0;color:#c3ccda}.lk{padding:2px 0;cursor:pointer;color:#9cc7ff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.lk.broken{color:#d98a8a;cursor:default}.lk.file{color:#c9b48a;cursor:default}
#search{display:none;flex:1;flex-direction:column;padding:12px 16px;overflow:auto}
#search input{width:100%;padding:8px 10px;background:#1b1f26;border:1px solid #333a45;border-radius:8px;color:#fff}
article{border:1px solid #2a2e36;border-radius:8px;padding:10px;margin:10px 0;background:#191d24}
.meta{font-size:12px;color:#8b96a8}.meta b{color:#9cc7ff}.ex{white-space:pre-wrap;color:#cfd6e2;margin-top:6px}
#drafts{display:none;flex:1;min-height:0}
#dlist{width:290px;border-right:1px solid #2a2e36;overflow:auto;padding:6px 0;flex:none}
#dview{flex:1;display:flex;flex-direction:column;min-width:0;padding:10px 14px;gap:8px;overflow:auto}
#dtext,#dreport{white-space:pre-wrap;font:12px/1.6 ui-monospace,Consolas,monospace;background:#191d24;border:1px solid #2a2e36;border-radius:8px;padding:10px;margin:0;overflow:auto}
#dtext{color:#cfd6e2;max-height:40%}#dreport{color:#9fd0a8}
.ditem{padding:3px 12px;cursor:pointer;color:#c3ccda;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ditem:hover{background:#1d222b}.ditem.on{background:#263041;color:#fff}.dgrp{padding:6px 12px 2px;color:#8b96a8;font-size:11px}
</style>
<header><b>dsh-kb</b><span class="tab on" id="t-notes">笔记</span><span class="tab" id="t-search">检索</span><span class="tab" id="t-drafts">草稿</span><span id="status" style="margin-left:auto;color:#7d8798;font-size:12px"></span></header>
<main>
  <aside><input id="filter" placeholder="过滤笔记…"><div id="tree"></div></aside>
  <div id="pane">
    <div id="bar"><span id="path">未选择笔记</span><span style="margin-left:auto"></span><button id="save" disabled>保存</button></div>
    <textarea id="editor" spellcheck="false" placeholder="从左侧选一篇笔记…"></textarea>
    <div id="links"></div>
  </div>
  <div id="search"><input id="q" placeholder="检索书库与笔记（回车）"><label style="display:flex;gap:6px;align-items:center;margin:8px 0;font-size:12px;color:#8b96a8"><input type="checkbox" id="withNotes" checked> 含笔记（笔记按标题/正文单独打分）</label><div id="hits"></div></div>
  <div id="drafts">
    <div id="dlist"></div>
    <div id="dview">
      <div style="display:flex;gap:8px;align-items:center"><span id="dpath" style="color:#8b96a8;font-size:12px">未选择草稿</span><span style="margin-left:auto"></span><button id="dcompile">编译</button><button id="dpreview">预览合并</button><button id="dconfirm">确认落盘</button></div>
      <pre id="dtext"></pre>
      <pre id="dreport"></pre>
    </div>
  </div>
</main>
<script>
var NL=String.fromCharCode(10);
window.onerror=function(m,src,line,col){var s=document.getElementById("status");if(s){s.textContent="脚本错误: "+m+" @"+line+":"+col;s.style.color="#d98a8a"}};
var notes=[],current="",expanded={},tree=null,currentMtime=0,dCur={kind:"",path:""};
var byId={};
["tree","editor","path","save","status","filter","q","hits","search","pane","links","drafts","dlist","dtext","dreport","dpath","dcompile","dpreview","dconfirm","withNotes","t-notes","t-search","t-drafts"].forEach(function(id){byId[id]=document.getElementById(id)});
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;")}
function build(list){var root={dirs:{},files:[]};list.forEach(function(p){var parts=p.split("/");var name=parts.pop();var node=root;parts.forEach(function(d){node.dirs[d]=node.dirs[d]||{dirs:{},files:[]};node=node.dirs[d]});node.files.push({name:name,path:p})});return root}
function expandAncestors(path){var parts=path.split("/");parts.pop();var acc="";parts.forEach(function(d){acc=acc===""?d:acc+"/"+d;expanded[acc]=true})}
function renderNode(node,prefix,depth){var html="";var dirs=Object.keys(node.dirs).sort(function(a,b){return a.localeCompare(b)});dirs.forEach(function(d){var path=prefix===""?d:prefix+"/"+d;var open=expanded[path]===true;html+='<div class="row" data-d="'+esc(path)+'"><span class="arrow">'+(open?"▾":"▸")+"</span>"+esc(d)+"</div>";if(open)html+='<div class="folder">'+renderNode(node.dirs[d],path,depth+1)+"</div>"});node.files.slice().sort(function(a,b){return a.name.localeCompare(b.name)}).forEach(function(f){html+='<div class="row note'+(f.path===current?" on":"")+'" data-p="'+esc(f.path)+'">'+esc(f.name)+"</div>"});return html}
function render(){var f=byId.filter.value.trim().toLowerCase();if(f!==""){var hits=notes.filter(function(n){return n.toLowerCase().indexOf(f)>=0}).slice(0,300);byId.tree.innerHTML=hits.map(function(n){return '<div class="row note" data-p="'+esc(n)+'">'+esc(n)+"</div>"}).join("")||'<div class="row">无匹配</div>';return}byId.tree.innerHTML=renderNode(tree,"",0)}
byId.tree.addEventListener("click",function(e){var dir=e.target.closest("[data-d]");if(dir){var p=dir.getAttribute("data-d");expanded[p]=!expanded[p];render();return}var note=e.target.closest(".note");if(note)openNote(note.getAttribute("data-p"))});
async function openNote(p){current=p;expandAncestors(p);render();try{var r=await fetch("/api/note?path="+encodeURIComponent(p));var j=await r.json();if(!j.ok){byId.status.textContent="读取失败";return}byId.path.textContent=p;byId.editor.value=j.text;currentMtime=j.mtime||0;byId.save.disabled=false;byId.status.textContent="";loadLinks(p)}catch(err){byId.status.textContent="读取失败"}}
async function loadLinks(p){try{var r=await fetch("/api/links?path="+encodeURIComponent(p));var j=await r.json();if(!j.ok){byId.links.innerHTML="";byId.links.style.display="none";return}var html="";if(j.out.length)html+='<div class="grp">出链 '+j.out.length+"</div>"+j.out.map(function(l){if(!l.path)return '<div class="lk broken">'+esc(l.raw)+"（断链）</div>";if(l.kind==="file")return '<div class="lk file">'+esc(l.raw)+"（附件）</div>";return '<div class="lk" data-p="'+esc(l.path)+'">'+esc(l.raw)+"</div>"}).join("");if(j.back.length)html+='<div class="grp">反链 '+j.back.length+"</div>"+j.back.map(function(b){return '<div class="lk" data-p="'+esc(b)+'">'+esc(b)+"</div>"}).join("");byId.links.innerHTML=html||'<div class="grp">没有 wikilink</div>';byId.links.style.display="block"}catch(err){}}
byId.links.addEventListener("click",function(e){var el=e.target.closest(".lk[data-p]");if(el)openNote(el.getAttribute("data-p"))});
byId.save.onclick=async function(){try{var r=await fetch("/api/save",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({path:current,text:byId.editor.value,mtime:currentMtime})});var j=await r.json();if(j.ok){currentMtime=j.mtime||currentMtime;byId.status.textContent="已保存";return}if(j.code==="conflict"){byId.editor.value=j.text;currentMtime=j.mtime||0;byId.status.textContent="文件被别处改过，已载入最新版本";return}byId.status.textContent="保存失败："+(j.error||"")}catch(err){byId.status.textContent="保存失败"}};
byId.filter.oninput=render;
async function load(){try{var r=await fetch("/api/notes");var j=await r.json();if(!j.ok)throw new Error("bad");notes=j.notes||[];tree=build(notes);byId.status.textContent=notes.length+" 篇笔记";render()}catch(err){byId.status.textContent="知识库服务正在启动…";setTimeout(load,1500)}}
function showTab(which){byId["t-notes"].classList.toggle("on",which==="notes");byId["t-search"].classList.toggle("on",which==="search");byId["t-drafts"].classList.toggle("on",which==="drafts");byId.pane.style.display=which==="notes"?"flex":"none";byId.search.style.display=which==="search"?"flex":"none";byId.drafts.style.display=which==="drafts"?"flex":"none";if(which==="drafts")loadDrafts()}
byId["t-notes"].onclick=function(){showTab("notes")};byId["t-search"].onclick=function(){showTab("search")};byId["t-drafts"].onclick=function(){showTab("drafts")};
async function loadDrafts(){try{var j=await (await fetch("/api/drafts")).json();if(!j.ok)return;var h="";if(j.drafts.length)h+='<div class="dgrp">收件箱 '+j.drafts.length+"</div>"+j.drafts.map(function(p){return '<div class="ditem" data-k="draft" data-p="'+esc(p)+'">'+esc(p)+"</div>"}).join("");if(j.compiled.length)h+='<div class="dgrp">已编译 '+j.compiled.length+"</div>"+j.compiled.map(function(p){return '<div class="ditem" data-k="compiled" data-p="'+esc(p)+'">'+esc(p)+"</div>"}).join("");byId.dlist.innerHTML=h||'<div class="dgrp">没有草稿</div>'}catch(err){}}
byId.dlist.addEventListener("click",async function(e){var el=e.target.closest(".ditem");if(!el)return;dCur={kind:el.getAttribute("data-k"),path:el.getAttribute("data-p")};Array.prototype.forEach.call(byId.dlist.querySelectorAll(".ditem"),function(n){n.classList.remove("on")});el.classList.add("on");byId.dpath.textContent=dCur.kind+" · "+dCur.path;try{var j=await (await fetch("/api/draft?path="+encodeURIComponent(dCur.path))).json();byId.dtext.textContent=j.ok?j.text:"读取失败："+j.error}catch(err){byId.dtext.textContent="读取失败"}byId.dreport.textContent=""});
byId.dcompile.onclick=async function(){if(dCur.kind!=="draft"){byId.dreport.textContent="先选一篇收件箱草稿";return}try{var j=await (await fetch("/api/compile",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({paths:[dCur.path]})})).json();var n=(j.notes||[])[0]||{};byId.dreport.textContent="编译："+(n.written?"已写入 ":"未写入 ")+(n.output||n.error||"")+NL+(n.changes||[]).join(NL);loadDrafts()}catch(err){byId.dreport.textContent="编译失败"}};
async function promote(confirm){if(dCur.kind!=="compiled"){byId.dreport.textContent="先选一篇已编译草稿";return}try{var j=await (await fetch("/api/promote",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({source:dCur.path,confirm:confirm,force:confirm})})).json();if(j.ok===false){byId.dreport.textContent="失败："+(j.error||"");return}byId.dreport.textContent=(j.notes||[]).map(function(n){return n.status+" "+n.source+" -> "+n.target+NL+(n.diff||[]).map(function(d){return "  "+d.kind+" "+d.text}).join(NL)}).join(NL)||"没有可提升的草稿";if(confirm)loadDrafts()}catch(err){byId.dreport.textContent="失败"}}
byId.dpreview.onclick=function(){promote(false)};byId.dconfirm.onclick=function(){promote(true)};
byId.q.addEventListener("keydown",async function(e){
  if(e.key!=="Enter")return;
  var text=byId.q.value.trim(); if(!text)return;
  byId.hits.textContent="检索中…";
  var extra=byId.withNotes.checked?"&notes=1&notesLimit=5":"";
  try{
    var j=await (await fetch("/api/query?q="+encodeURIComponent(text)+"&k=8"+extra)).json();
    byId.hits.innerHTML=j.hits.map(function(h){
      var note=h.kind==="note";
      var pages=note?"笔记":"p."+(h.pageStart||h.page)+(h.pageEnd&&h.pageEnd!==h.page?"-"+h.pageEnd:"");
      var head=esc(h.path)+" · "+(note?"":("§"+esc(h.section||"—")+" · "))+pages+" · "+h.score;
      return '<article><div class="meta"><b>'+esc(h.path)+'</b> · '+(note?"笔记":("§"+esc(h.section||"—")+" · "))+pages+' · '+h.score+'</div><div class="ex">'+esc(h.excerpt)+'</div></article>';
    }).join("")||"没有命中";
  }catch(err){byId.hits.textContent="检索失败"}
});
load();
</script></html>
