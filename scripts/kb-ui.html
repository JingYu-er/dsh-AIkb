<!doctype html><html lang="zh"><meta charset="utf-8"><title>dsh-kb</title>
<style>
:root{color-scheme:dark}body{margin:0;font:15px/1.6 system-ui,"Segoe UI",sans-serif;background:#14161a;color:#e6e6e6}
header{padding:18px 22px;border-bottom:1px solid #2a2e36;display:flex;gap:12px;align-items:center}
h1{font-size:16px;margin:0;color:#9cc7ff}input{flex:1;padding:10px 12px;border-radius:8px;border:1px solid #333a45;background:#1b1f26;color:#fff;font-size:15px}
button{padding:8px 13px;border-radius:8px;border:1px solid #333a45;background:#232833;color:#cfe3ff;cursor:pointer;margin-top:6px}
main{padding:16px 22px;max-width:980px}article{border:1px solid #2a2e36;border-radius:10px;padding:12px 14px;margin:12px 0;background:#191d24}
.meta{font-size:12px;color:#8b96a8;margin-bottom:6px}.meta b{color:#9cc7ff;font-weight:600}
.ex{white-space:pre-wrap;color:#cfd6e2}.ctx{white-space:pre-wrap;color:#a9b4c4;border-top:1px dashed #2f3540;margin-top:8px;padding-top:8px;display:none}
.hint{color:#7d8798;font-size:13px}
</style>
<header><h1>dsh-kb</h1><input id="q" placeholder="问一句，或输入关键词（中文/英文）"><button id="go">检索</button></header>
<main><div id="out" class="hint">按回车开始。命中会给出「书 / 章 / 页区间」。</div></main>
<script>
var out=document.getElementById('out'),q=document.getElementById('q');
function esc(s){return String(s).replace(/</g,'&lt;')}
async function run(){
  var text=q.value.trim(); if(!text)return; out.innerHTML='检索中…';
  var r=await fetch('/api/query?q='+encodeURIComponent(text)+'&k=8'); var j=await r.json();
  if(!j.ok){out.textContent='出错：'+j.error;return}
  if(!j.hits.length){out.textContent='没有命中';return}
  out.innerHTML=j.hits.map(function(h,i){
    var pages='p.'+(h.pageStart||h.page)+(h.pageEnd&&h.pageEnd!==h.page?'-'+h.pageEnd:'');
    return '<article><div class="meta"><b>'+esc(h.path)+'</b> · §'+esc(h.section||'—')+' · '+pages+' · '+h.score+'</div>'+
      '<div class="ex">'+esc(h.excerpt)+'</div><div class="ctx" id="c'+i+'"></div>'+
      '<button onclick="expand('+i+',\''+encodeURIComponent(h.path)+'\','+h.page+')">展开本章</button></article>';
  }).join('');
}
window.expand=async function(i,path,page){
  var el=document.getElementById('c'+i);
  if(el.style.display==='block'){el.style.display='none';return}
  el.textContent='加载中…'; el.style.display='block';
  var r=await fetch('/api/section?path='+path+'&page='+page); var j=await r.json();
  el.textContent=j.ok?j.context:('出错：'+j.error);
};
document.getElementById('go').onclick=run;
q.addEventListener('keydown',function(e){if(e.key==='Enter')run()});
</script></html>
