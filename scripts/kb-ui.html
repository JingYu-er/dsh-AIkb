<!doctype html><html lang="zh"><meta charset="utf-8"><title>dsh-kb</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;font:14px/1.6 system-ui,"Segoe UI",sans-serif;background:#14161a;color:#e6e6e6;height:100vh;display:flex;flex-direction:column}
header{display:flex;gap:16px;align-items:center;padding:8px 14px;border-bottom:1px solid #2a2e36;flex:none}
header b{color:#9cc7ff;font-size:13px}header .tab{padding:5px 10px;border-radius:6px;cursor:pointer;color:#8b96a8}header .tab.on{background:#232833;color:#cfe3ff}
main{flex:1;display:flex;min-height:0}aside{width:300px;border-right:1px solid #2a2e36;overflow:auto;flex:none;padding:6px 0}
aside input{width:calc(100% - 16px);margin:4px 8px 8px;padding:6px 8px;background:#1b1f26;border:1px solid #333a45;border-radius:6px;color:#fff}
.row{padding:2px 10px;cursor:pointer;color:#c3ccda;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px;display:flex;gap:5px;align-items:center}
.row:hover{background:#1d222b}.row.note.on{background:#263041;color:#fff}
.arrow{width:12px;flex:none;color:#7d8798;font-size:11px;text-align:center}
.dir{color:#d7dee9;font-weight:500}
.folder{padding-left:10px;border-left:1px solid #232833;margin-left:6px}
#pane{flex:1;display:flex;flex-direction:column;min-width:0}
#bar{display:flex;gap:8px;align-items:center;padding:6px 10px;border-bottom:1px solid #2a2e36;color:#8b96a8;font-size:12px;flex:none}
button{padding:5px 10px;border-radius:6px;border:1px solid #333a45;background:#232833;color:#cfe3ff;cursor:pointer}
textarea{flex:1;width:100%;border:0;background:#14161a;color:#dbe3ef;padding:14px 18px;font:13px/1.7 ui-monospace,Consolas,monospace;resize:none}
#search{display:none;flex:1;flex-direction:column;padding:12px 16px;overflow:auto}
#search input{width:100%;padding:8px 10px;background:#1b1f26;border:1px solid #333a45;border-radius:8px;color:#fff}
article{border:1px solid #2a2e36;border-radius:8px;padding:10px;margin:10px 0;background:#191d24}
.meta{font-size:12px;color:#8b96a8}.meta b{color:#9cc7ff}.ex{white-space:pre-wrap;color:#cfd6e2;margin-top:6px}
#links{flex:none;max-height:30%;overflow:auto;border-top:1px solid #2a2e36;padding:6px 12px;font-size:12px;color:#8b96a8;display:none}
.grp{margin:3px 0;color:#c3ccda}.lk{padding:2px 0;cursor:pointer;color:#9cc7ff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.lk.broken{color:#d98a8a;cursor:default}
</style>
<header><b>dsh-kb</b><span class="tab on" id="t-notes">笔记</span><span class="tab" id="t-search">检索</span><span id="status" style="margin-left:auto;color:#7d8798;font-size:12px"></span></header>
<main>
  <aside><input id="filter" placeholder="过滤笔记…"><div id="tree"></div></aside>
  <div id="pane">
    <div id="bar"><span id="path">未选择笔记</span><span style="margin-left:auto"></span><button id="save" disabled>保存</button></div>
    <textarea id="editor" spellcheck="false" placeholder="从左侧选一篇笔记…"></textarea>
    <div id="links"></div>
  </div>
  <div id="search"><input id="q" placeholder="检索书库（回车）"><div id="hits"></div></div>
</main>
<script>
var notes=[], current='', expanded={}, tree=null, currentMtime=0;
var byId={
  tree:document.getElementById('tree'), editor:document.getElementById('editor'), path:document.getElementById('path'),
  save:document.getElementById('save'), status:document.getElementById('status'), filter:document.getElementById('filter'),
  q:document.getElementById('q'), hits:document.getElementById('hits'), search:document.getElementById('search'),
  links:document.getElementById('links'),
  pane:document.getElementById('pane'), tNotes:document.getElementById('t-notes'), tSearch:document.getElementById('t-search')
};
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;')}
function build(list){
  var root={dirs:{},files:[]};
  list.forEach(function(p){
    var parts=p.split('/'); var name=parts.pop(); var node=root;
    parts.forEach(function(d){ node.dirs[d]=node.dirs[d]||{dirs:{},files:[]}; node=node.dirs[d]; });
    node.files.push({name:name,path:p});
  });
  return root;
}
function expandAncestors(path){
  var parts=path.split('/'); parts.pop(); var acc='';
  parts.forEach(function(d){ acc=acc===''?d:acc+'/'+d; expanded[acc]=true; });
}
function renderNode(node,prefix,depth){
  var html='', dirs=Object.keys(node.dirs).sort(function(a,b){return a.localeCompare(b)});
  dirs.forEach(function(d){
    var path=prefix===''?d:prefix+'/'+d; var open=expanded[path]===true;
    html+='<div class="row dir" data-d="'+esc(path)+'"><span class="arrow">'+(open?'▾':'▸')+'</span>'+esc(d)+'</div>';
    if(open) html+='<div class="folder" style="margin-left:'+(depth*8)+'px">'+renderNode(node.dirs[d],path,depth+1)+'</div>';
  });
  node.files.slice().sort(function(a,b){return a.name.localeCompare(b.name)}).forEach(function(f){
    html+='<div class="row note'+(f.path===current?' on':'')+'" data-p="'+esc(f.path)+'" style="padding-left:'+(10+depth*8)+'px'+(f.path===current?';background:#263041;color:#fff':'')+'">'+esc(f.name)+'</div>';
  });
  return html;
}
function render(){
  var f=byId.filter.value.trim().toLowerCase();
  if(f!==''){
    var hits=notes.filter(function(n){return n.toLowerCase().indexOf(f)>=0}).slice(0,300);
    byId.tree.innerHTML=hits.map(function(n){return '<div class="row note" data-p="'+esc(n)+'">'+esc(n)+'</div>'}).join('')||'<div class="row" style="color:#7d8798">无匹配</div>';
    return;
  }
  byId.tree.innerHTML=renderNode(tree,'',0);
}
byId.tree.addEventListener('click',function(e){
  var dir=e.target.closest('.dir');
  if(dir){var p=dir.getAttribute('data-d'); expanded[p]=!expanded[p]; render(); return;}
  var note=e.target.closest('.note');
  if(note) openNote(note.getAttribute('data-p'));
});
async function openNote(p){
  current=p; expandAncestors(p); render();
  var r=await fetch('/api/note?path='+encodeURIComponent(p)); var j=await r.json();
  if(!j.ok){byId.status.textContent='读取失败';return}
  byId.path.textContent=p; byId.editor.value=j.text; currentMtime=j.mtime||0; byId.save.disabled=false; byId.status.textContent=''; loadLinks(p);
}
async function loadLinks(p){
  var r=await fetch('/api/links?path='+encodeURIComponent(p)); var j=await r.json();
  if(!j.ok){byId.links.innerHTML='';byId.links.style.display='none';return}
  var html='';
  if(j.out.length)html+='<div class="grp">出链 '+j.out.length+'</div>'+j.out.map(function(l){
    if(!l.path)return '<div class="lk broken">'+esc(l.raw)+'（断链）</div>';
    if(l.kind==='file')return '<div class="lk broken" style="color:#c9b48a">'+esc(l.raw)+'（附件）</div>';
    return '<div class="lk" data-p="'+l.path+'">'+esc(l.raw)+'</div>';
  }).join('');
  if(j.back.length)html+='<div class="grp">反链 '+j.back.length+'</div>'+j.back.map(function(b){return '<div class="lk" data-p="'+esc(b)+'">'+esc(b)+'</div>'}).join('');
  byId.links.innerHTML=html||'<div class="grp">这篇笔记没有 wikilink</div>';
  byId.links.style.display='block';
}
document.getElementById('links').addEventListener('click',function(e){
  var el=e.target.closest('.lk'); if(!el)return; var p=el.getAttribute('data-p'); if(p) openNote(p);
});
byId.save.onclick=async function(){
  var r=await fetch('/api/save',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({path:current,text:byId.editor.value,mtime:currentMtime})});
  var j=await r.json();
  if(j.ok){currentMtime=j.mtime||currentMtime;byId.status.textContent='已保存（备份 '+String(j.backup||'').split('/').pop()+'）';return}
  if(j.code==='conflict'){
    byId.editor.value=j.text; currentMtime=j.mtime||0;
    byId.status.textContent='文件被别处改过，已载入最新版本，请重新编辑';
    return;
  }
  byId.status.textContent='保存失败：'+(j.error||'');
};
byId.filter.oninput=render;
async function load(){
  var r=await fetch('/api/notes'); var j=await r.json();
  if(!j.ok){byId.status.textContent='加载失败';return}
  notes=j.notes||[]; tree=build(notes); byId.status.textContent=notes.length+' 篇笔记'; render();
}
byId.tNotes.onclick=function(){byId.tNotes.classList.add('on');byId.tSearch.classList.remove('on');byId.pane.style.display='flex';byId.search.style.display='none'};
byId.tSearch.onclick=function(){byId.tSearch.classList.add('on');byId.tNotes.classList.remove('on');byId.search.style.display='flex';byId.pane.style.display='none'};
byId.q.addEventListener('keydown',async function(e){
  if(e.key!=='Enter')return; var text=byId.q.value.trim(); if(!text)return;
  byId.hits.textContent='检索中…';
  var r=await fetch('/api/query?q='+encodeURIComponent(text)+'&k=8'); var j=await r.json();
  if(!j.ok){byId.hits.textContent='出错：'+j.error;return}
  byId.hits.innerHTML=j.hits.map(function(h){
    var pages='p.'+(h.pageStart||h.page)+(h.pageEnd&&h.pageEnd!==h.page?'-'+h.pageEnd:'');
    return '<article><div class="meta"><b>'+esc(h.path)+'</b> · §'+esc(h.section||'—')+' · '+pages+' · '+h.score+'</div><div class="ex">'+esc(h.excerpt)+'</div></article>';
  }).join('')||'没有命中';
});
load();
</script></html>
