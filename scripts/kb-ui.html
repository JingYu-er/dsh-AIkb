<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;font:14px/1.6 system-ui,"Segoe UI",sans-serif;background:#14161a;color:#e6e6e6;height:100vh;display:flex;flex-direction:column}

.ditem:hover{background:#1d222b}.ditem.on{background:#263041;color:#fff}.dgrp{padding:6px 12px 2px;color:#8b96a8;font-size:11px}

#preport:empty{display:none}

#qlist{width:290px;border-right:1px solid #2a2e36;overflow:auto;padding:6px 0;flex:none}
#qview{flex:1;display:flex;flex-direction:column;min-width:0;padding:10px 14px;gap:8px;overflow:hidden}
#qbar{display:flex;gap:8px;align-items:center;font-size:12px;color:#8b96a8;flex-wrap:wrap}
#qhint{font-size:12px;color:#8b96a8;background:#191d24;border:1px solid #2a2e36;border-radius:8px;padding:6px 10px}
#qbody{display:flex;flex:1;min-height:0;gap:0}

.qrow{display:flex;gap:8px;align-items:flex-start;border-bottom:1px solid #232833;padding:8px 0;font-size:12px;color:#c3ccda}
.qrow.on{background:#1b2029}.qrow.done{opacity:.55}.qmark{width:16px;flex:none;text-align:center;color:#7d8798}
.qrow .c{flex:1;min-width:0;white-space:pre-wrap;word-break:break-word}.qrow .c b{color:#9cc7ff}
.qrow input[type=text]{flex:1;min-width:140px;padding:4px 6px;background:#1b1f26;border:1px solid #333a45;border-radius:6px;color:#fff;font:12px/1.4 system-ui}
.qrow select{padding:4px 6px;background:#1b1f26;border:1px solid #333a45;border-radius:6px;color:#fff;font-size:12px}
.split{flex:0 0 6px;cursor:col-resize;background:transparent;position:relative}
.split:hover,.split.on{background:#3a4352}
.split::after{content:"";position:absolute;left:2px;top:0;bottom:0;width:2px;background:#2a2e36}
.split:hover::after,.split.on::after{background:#5b6b86}
.split[data-dir="b"],.split[data-dir="t"]{cursor:row-resize}
.split[data-dir="b"]::after,.split[data-dir="t"]::after{left:0;right:0;top:2px;bottom:auto;width:auto;height:2px}
#qreport:empty{display:none}
#qreport{white-space:pre-wrap;font:12px/1.6 ui-monospace,Consolas,monospace;background:#191d24;border:1px solid #2a2e36;border-radius:8px;padding:10px;margin:0;color:#9fd0a8}
</style>
<header><b>dsh-kb</b><span class="tab on" id="t-notes">笔记</span><span class="tab" id="t-search">检索</span><span class="tab" id="t-drafts">草稿</span><span class="tab" id="t-links">入链</span><span class="tab" id="t-review">矛盾</span><span id="status" style="margin-left:auto;color:#7d8798;font-size:12px"></span></header>
<main>
  <aside id="side"><input id="filter" placeholder="过滤笔记…"><div id="tree"></div></aside>
  <div class="split" data-el="side" data-dir="l"></div>
  <div id="pane">
    <div id="bar"><span id="path">未选择笔记</span><span style="margin-left:auto"></span><button id="save" disabled>保存</button></div>
    <textarea id="editor" spellcheck="false" placeholder="从左侧选一篇笔记…"></textarea>
    <div id="links"></div>
  </div>
  <div id="search"><input id="q" placeholder="检索书库与笔记（回车）"><label style="display:flex;gap:6px;align-items:center;margin:8px 0;font-size:12px;color:#8b96a8"><input type="checkbox" id="withNotes" checked> 含笔记（笔记按标题/正文单独打分）</label><div id="hits"></div></div>
  <div id="drafts">
    <div id="dlist"></div>
    <div class="split" data-el="dlist" data-dir="l"></div>
    <div id="dview">
      <div style="display:flex;gap:8px;align-items:center"><span id="dpath" style="color:#8b96a8;font-size:12px">未选择草稿</span><span style="margin-left:auto"></span><button id="dcompile">编译</button><button id="dpreview">预览合并</button><button id="dconfirm">确认落盘</button></div>
      <pre id="dtext"></pre>
      <pre id="dreport"></pre>
    </div>
  </div>
  <div id="plinks">
    <div id="pview">
      <div id="pbar"><span id="ppath" style="color:#8b96a8">未选择笔记</span><span style="margin-left:auto"></span><button id="prefresh">重新计算</button></div>
      <div id="pbody">
        <pre id="ptext"></pre>
        <div class="split" data-el="pside" data-dir="r"></div>
        <div id="pside"><div id="phint">点击左侧目录中的笔记：这里会同时显示它的内容和可能相关的笔记。</div><div id="pcands"></div><pre id="preport"></pre></div>
      </div>
    </div>
  </div>
  <div id="queue">
    <div id="qlist"></div>
    <div class="split" data-el="qlist" data-dir="l"></div>
    <div id="qview">
      <div id="qbar"><span id="qpath" style="color:#8b96a8">未选择矛盾队列</span><span style="margin-left:auto"></span><button id="qscanreview">扫描矛盾候选</button><button id="qarchive">归档已处理</button></div>
      <div id="qhint"></div>
      <div id="qbody">
        <div id="qtexts"><div class="qdoc" id="qnewdoc"><div class="qdochd">新笔记 <span id="qnewname"></span></div><pre id="qnewtext"></pre></div><div class="split" data-el="qnewdoc" data-dir="b"></div><div class="qdoc" id="qolddoc"><div class="qdochd">旧笔记 <span id="qoldname"></span></div><pre id="qoldtext"></pre></div></div>
        <div class="split" data-el="qtexts" data-dir="r"></div>
        <div id="qrows"></div>
      </div>
      <pre id="qreport"></pre>
    </div>
  </div>
</main>
<script>
var NL=String.fromCharCode(10);
window.onerror=function(m,src,line,col){var s=document.getElementById("status");if(s){s.textContent="脚本错误: "+m+" @"+line+":"+col;s.style.color="#d98a8a"}};
var notes=[],current="",expanded={},tree=null,currentMtime=0,dCur={kind:"",path:""};
var byId={};
["tree","editor","path","save","status","filter","q","hits","search","pane","links","drafts","dlist","dtext","dreport","dpath","dcompile","dpreview","dconfirm","withNotes","t-notes","t-search","t-drafts","t-links","t-review","queue","qlist","qview","qpath","qhint","qtexts","qnewname","qnewtext","qoldname","qoldtext","qrows","qreport","qscanreview","qarchive","plinks","pview","ppath","ptext","pside","phint","pcands","preport","prefresh"].forEach(function(id){byId[id]=document.getElementById(id)});
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;")}
var WIDTH_KEY="kbUiWidths";
function savedWidths(){try{return JSON.parse(localStorage.getItem(WIDTH_KEY)||"{}")}catch(e){return {}}}
function sizeKey(id,dir){return (dir==="b"||dir==="t")?id+":h":id}
function applySavedWidths(){var w=savedWidths();Object.keys(w).forEach(function(k){var vert=k.slice(-2)===":h";var id=vert?k.slice(0,-2):k;var el=document.getElementById(id);if(el&&w[k])el.style.flex="0 0 "+w[k]+"px"})}
function setWidth(id,px,dir){var el=document.getElementById(id);if(!el)return;el.style.flex="0 0 "+Math.round(px)+"px";var w=savedWidths();w[sizeKey(id,dir)]=Math.round(px);try{localStorage.setItem(WIDTH_KEY,JSON.stringify(w))}catch(e){}}
function clearWidth(id,dir){var el=document.getElementById(id);if(el)el.style.flex="";var w=savedWidths();delete w[sizeKey(id,dir)];try{localStorage.setItem(WIDTH_KEY,JSON.stringify(w))}catch(e){}}
function mkSplit(el){var id=el.getAttribute("data-el");var dir=el.getAttribute("data-dir")||"l";var target=document.getElementById(id);if(!target)return;var vert=(dir==="b"||dir==="t");
  el.addEventListener("mousedown",function(ev){ev.preventDefault();var s0=vert?ev.clientY:ev.clientX;var r0=target.getBoundingClientRect();var sw=vert?r0.height:r0.width;document.body.style.cursor=vert?"row-resize":"col-resize";el.classList.add("on");
    function mv(e2){var d=(vert?e2.clientY:e2.clientX)-s0;var v=(dir==="l"||dir==="b")?sw+d:sw-d;v=vert?Math.max(120,Math.min(v,window.innerHeight-260)):Math.max(160,Math.min(v,window.innerWidth-360));setWidth(id,v,dir)}
    function up(){document.body.style.cursor="";el.classList.remove("on");document.removeEventListener("mousemove",mv);document.removeEventListener("mouseup",up)}
    document.addEventListener("mousemove",mv);document.addEventListener("mouseup",up)});
  el.addEventListener("dblclick",function(){clearWidth(id,dir)});
  el.addEventListener("mouseenter",function(){document.body.style.cursor=vert?"row-resize":"col-resize"});
  el.addEventListener("mouseleave",function(){if(!el.classList.contains("on"))document.body.style.cursor=""})}
applySavedWidths();Array.prototype.forEach.call(document.querySelectorAll(".split"),mkSplit);
function build(list){var root={dirs:{},files:[]};list.forEach(function(p){var parts=p.split("/");var name=parts.pop();var node=root;parts.forEach(function(d){node.dirs[d]=node.dirs[d]||{dirs:{},files:[]};node=node.dirs[d]});node.files.push({name:name,path:p})});return root}
function expandAncestors(path){var parts=path.split("/");parts.pop();var acc="";parts.forEach(function(d){acc=acc===""?d:acc+"/"+d;expanded[acc]=true})}
function renderNode(node,prefix,depth){var html="";var dirs=Object.keys(node.dirs).sort(function(a,b){return a.localeCompare(b)});dirs.forEach(function(d){var path=prefix===""?d:prefix+"/"+d;var open=expanded[path]===true;html+='<div class="row" data-d="'+esc(path)+'"><span class="arrow">'+(open?"▾":"▸")+"</span>"+esc(d)+"</div>";if(open)html+='<div class="folder">'+renderNode(node.dirs[d],path,depth+1)+"</div>"});node.files.slice().sort(function(a,b){return a.name.localeCompare(b.name)}).forEach(function(f){html+='<div class="row note'+(f.path===current?" on":"")+'" data-p="'+esc(f.path)+'">'+esc(f.name)+"</div>"});return html}
function render(){var f=byId.filter.value.trim().toLowerCase();if(f!==""){var hits=notes.filter(function(n){return n.toLowerCase().indexOf(f)>=0}).slice(0,300);byId.tree.innerHTML=hits.map(function(n){return '<div class="row note" data-p="'+esc(n)+'">'+esc(n)+"</div>"}).join("")||'<div class="row">无匹配</div>';return}byId.tree.innerHTML=renderNode(tree,"",0)}
byId.tree.addEventListener("click",function(e){var dir=e.target.closest("[data-d]");if(dir){var p=dir.getAttribute("data-d");expanded[p]=!expanded[p];render();return}var note=e.target.closest(".note");if(note){var np=note.getAttribute("data-p");if(curTab==="links"){if(/^inbox\//i.test(np)){byId.ppath.textContent=np;byId.ptext.textContent="";byId.pcands.innerHTML="";byId.phint.textContent="这是收件箱/队列文件，不是正式笔记：入链只对正式笔记计算。"}else{selectPNote(np)}}else{openNote(np)}}});
async function openNote(p){current=p;expandAncestors(p);render();try{var r=await fetch("/api/note?path="+encodeURIComponent(p));var j=await r.json();if(!j.ok){byId.status.textContent="读取失败";return}byId.path.textContent=p;byId.editor.value=j.text;currentMtime=j.mtime||0;byId.save.disabled=false;byId.status.textContent="";loadLinks(p)}catch(err){byId.status.textContent="读取失败"}}
async function loadLinks(p){try{var r=await fetch("/api/links?path="+encodeURIComponent(p));var j=await r.json();if(!j.ok){byId.links.innerHTML="";byId.links.style.display="none";return}var html="";if(j.out.length)html+='<div class="grp">出链 '+j.out.length+"</div>"+j.out.map(function(l){if(!l.path)return '<div class="lk broken">'+esc(l.raw)+"（断链）</div>";if(l.kind==="file")return '<div class="lk file">'+esc(l.raw)+"（附件）</div>";return '<div class="lk" data-p="'+esc(l.path)+'">'+esc(l.raw)+"</div>"}).join("");if(j.back.length)html+='<div class="grp">反链 '+j.back.length+"</div>"+j.back.map(function(b){return '<div class="lk" data-p="'+esc(b)+'">'+esc(b)+"</div>"}).join("");byId.links.innerHTML=html||'<div class="grp">没有 wikilink</div>';byId.links.style.display="block"}catch(err){}}
byId.links.addEventListener("click",function(e){var el=e.target.closest(".lk[data-p]");if(el)openNote(el.getAttribute("data-p"))});
byId.save.onclick=async function(){try{var r=await fetch("/api/save",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({path:current,text:byId.editor.value,mtime:currentMtime})});var j=await r.json();if(j.ok){currentMtime=j.mtime||currentMtime;byId.status.textContent="已保存";return}if(j.code==="conflict"){byId.editor.value=j.text;currentMtime=j.mtime||0;byId.status.textContent="文件被别处改过，已载入最新版本";return}byId.status.textContent="保存失败："+(j.error||"")}catch(err){byId.status.textContent="保存失败"}};
byId.filter.oninput=render;
async function load(){try{var r=await fetch("/api/notes");var j=await r.json();if(!j.ok)throw new Error("bad");notes=j.notes||[];tree=build(notes);byId.status.textContent=notes.length+" 篇笔记";render()}catch(err){byId.status.textContent="知识库服务正在启动…";setTimeout(load,1500)}}
function showTab(which){curTab=which;["notes","search","drafts","links","review"].forEach(function(k){byId["t-"+k].classList.toggle("on",which===k)});byId.pane.style.display=which==="notes"?"flex":"none";byId.search.style.display=which==="search"?"flex":"none";byId.drafts.style.display=which==="drafts"?"flex":"none";byId.plinks.style.display=which==="links"?"flex":"none";byId.queue.style.display=which==="review"?"flex":"none";if(which==="drafts")loadDrafts();if(which==="links"){if(pCur!==""){loadPossible()}else{byId.phint.textContent="点击左侧目录中的笔记：这里会同时显示它的内容和可能相关的笔记。"}}if(which==="review")loadQueues()}
byId["t-notes"].onclick=function(){showTab("notes")};byId["t-search"].onclick=function(){showTab("search")};byId["t-drafts"].onclick=function(){showTab("drafts")};byId["t-links"].onclick=function(){showTab("links")};byId["t-review"].onclick=function(){showTab("review")};
async function loadDrafts(){try{var j=await (await fetch("/api/drafts")).json();if(!j.ok)return;var h="";if(j.drafts.length)h+='<div class="dgrp">收件箱 '+j.drafts.length+"</div>"+j.drafts.map(function(p){return '<div class="ditem" data-k="draft" data-p="'+esc(p)+'">'+esc(p)+"</div>"}).join("");if(j.compiled.length)h+='<div class="dgrp">已编译 '+j.compiled.length+"</div>"+j.compiled.map(function(p){return '<div class="ditem" data-k="compiled" data-p="'+esc(p)+'">'+esc(p)+"</div>"}).join("");byId.dlist.innerHTML=h||'<div class="dgrp">没有草稿</div>'}catch(err){}}
byId.dlist.addEventListener("click",async function(e){var el=e.target.closest(".ditem");if(!el)return;dCur={kind:el.getAttribute("data-k"),path:el.getAttribute("data-p")};Array.prototype.forEach.call(byId.dlist.querySelectorAll(".ditem"),function(n){n.classList.remove("on")});el.classList.add("on");byId.dpath.textContent=dCur.kind+" · "+dCur.path;try{var j=await (await fetch("/api/draft?path="+encodeURIComponent(dCur.path))).json();byId.dtext.textContent=j.ok?j.text:"读取失败："+j.error}catch(err){byId.dtext.textContent="读取失败"}byId.dreport.textContent=""});
byId.dcompile.onclick=async function(){if(dCur.kind!=="draft"){byId.dreport.textContent="先选一篇收件箱草稿";return}try{var j=await (await fetch("/api/compile",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({paths:[dCur.path]})})).json();var n=(j.notes||[])[0]||{};var verdict=n.error?"失败：":(n.written?"已写入 ":(n.skipped?"内容未变，跳过写入 ":"未写入 "));byId.dreport.textContent="编译："+verdict+(n.output||n.error||"")+NL+(n.changes||[]).join(NL);await loadDrafts();if(n.output){var key=function(s){return String(s||"").replace(/^inbox\//,"")};var want=key(n.output);var el=Array.prototype.find.call(byId.dlist.querySelectorAll(".ditem"),function(x){return x.getAttribute("data-k")==="compiled"&&key(x.getAttribute("data-p"))===want});if(el)el.click()}}catch(err){byId.dreport.textContent="编译失败"}};
async function promote(confirm){if(dCur.kind!=="compiled"){byId.dreport.textContent="先选一篇已编译草稿（在「已编译」分组里点一下；若为空，先点「编译」）";return}try{var j=await (await fetch("/api/promote",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({source:dCur.path,confirm:confirm,force:confirm})})).json();if(j.ok===false){byId.dreport.textContent="失败："+(j.error||"");return}var label={create:"新建",update:"更新",conflict:"冲突（目标已有不同内容，未覆盖）",unchanged:"内容一致，无需重复落盘",failed:"失败"};byId.dreport.textContent=(j.notes||[]).map(function(n){return (label[n.status]||n.status)+(n.written?"（已写入）":"")+" "+n.source+" -> "+n.target+(n.error?" "+n.error:"")+NL+(n.diff||[]).map(function(d){return "  "+d.kind+" "+d.text}).join(NL)}).join(NL)||"没有可提升的草稿";if(confirm){await loadDrafts();var kept=Array.prototype.some.call(byId.dlist.querySelectorAll(".ditem"),function(x){return x.getAttribute("data-k")==="compiled"&&x.getAttribute("data-p")===dCur.path});if(!kept){dCur={kind:"",path:""};byId.dpath.textContent="未选择";byId.dtext.textContent=""}}}catch(err){byId.dreport.textContent="失败"}}
byId.dpreview.onclick=function(){promote(false)};byId.dconfirm.onclick=function(){promote(true)};
byId.q.addEventListener("keydown",async function(e){
  if(e.key!=="Enter")return;
  var text=byId.q.value.trim(); if(!text)return;
  byId.hits.textContent="检索中…";
  var extra=byId.withNotes.checked?"&notes=1&notesLimit=5":"";
  try{
    var j=await (await fetch("/api/query?q="+encodeURIComponent(text)+"&k=8"+extra)).json();
    byId.hits.innerHTML=j.hits.map(function(h){
      var note=h.kind==="note";
      var pages=note?"笔记":"p."+(h.pageStart||h.page)+(h.pageEnd&&h.pageEnd!==h.page?"-"+h.pageEnd:"");
      var head=esc(h.path)+" · "+(note?"":("§"+esc(h.section||"—")+" · "))+pages+" · "+h.score;
      return '<article><div class="meta"><b>'+esc(h.path)+'</b> · '+(note?"笔记":("§"+esc(h.section||"—")+" · "))+pages+' · '+h.score+'</div><div class="ex">'+esc(h.excerpt)+'</div></article>';
    }).join("")||"没有命中";
  }catch(err){byId.hits.textContent="检索失败"}
});
var qQueues={links:[],review:[]},qCur={kind:"",path:""},qSel=0;
function markQRow(){Array.prototype.forEach.call(byId.qrows.querySelectorAll(".qrow"),function(r,i){r.classList.toggle("on",i===qSel)})}
async function loadReviewTexts(item,index){var row=item.rows[index]||{};byId.qnewname.textContent=item.note||"";byId.qoldname.textContent=row.oldName?("· "+row.oldName):"";byId.qnewtext.textContent="读取中…";byId.qoldtext.textContent="";try{var a=await (await fetch("/api/note?path="+encodeURIComponent(item.note||""))).json();byId.qnewtext.textContent=a.ok?a.text:("读取失败："+(a.error||""))}catch(e){byId.qnewtext.textContent="读取失败"};if(!row.oldPath)return;try{var b=await (await fetch("/api/note?path="+encodeURIComponent(row.oldPath))).json();byId.qoldtext.textContent=b.ok?b.text:("读取失败："+(b.error||""))}catch(e){byId.qoldtext.textContent="读取失败"}}
function qLabel(item){return item.note||item.path.replace(/^inbox\/(links|review)\//,"")}
function findQueue(kind,path){var list=qQueues[kind]||[];for(var i=0;i<list.length;i++)if(list[i].path===path)return list[i];return null}
function qShort(item){var s=qLabel(item),i=s.lastIndexOf("/");return i<0?s:s.slice(i+1)}
function qItem(kind,item){var on=(qCur.kind===kind&&qCur.path===item.path)?" on":"";return '<div class="ditem'+on+'" data-qk="'+kind+'" data-qp="'+esc(item.path)+'" title="'+esc(qLabel(item))+'">'+esc(qShort(item))+"（待办 "+item.pending+"/"+item.rows.length+"）</div>"}
function renderQueueList(){var h="";if(qQueues.review.length)h+='<div class="dgrp">矛盾审查 '+qQueues.review.length+"</div>"+qQueues.review.map(function(x){return qItem("review",x)}).join("");byId.qlist.innerHTML=h||'<div class="dgrp">没有待处理队列</div>';if(!qCur.path)byId.qpath.textContent="未选择队列"}
async function loadQueues(){try{var j=await (await fetch("/api/queues?kind=review")).json();if(!j.ok)return;qQueues={links:[],review:j.queues||[]};renderQueueList();renderQueue()}catch(err){byId.qreport.textContent="矛盾队列读取失败"}}
function renderQueue(){var item=findQueue(qCur.kind,qCur.path);if(!item){byId.qrows.innerHTML="";byId.qhint.textContent="左侧选一份矛盾队列：选判定、填依据，再点「保存」。";return}
  byId.qpath.textContent=(qCur.kind==="links"?"链接候选":"矛盾审查")+" · "+qLabel(item);
  byId.qhint.textContent=qCur.kind==="links"?"在 why 里写清「为什么这两篇该连」，点「保存并应用」会把 [[目标]] — 说明 追加到源笔记的「## 关联」（写前自动备份；留空 = 不批准）。":"冲突 = 两说不能同时成立；细化 = 新说法是旧说法的补充；无关 = 相似度误报。选判定、填依据后点「保存」。";
  byId.qrows.innerHTML=item.rows.map(function(row,i){
    if(qCur.kind==="links"){var done=row.applied===true;return '<div class="qrow'+(done?" done":"")+'"><div class="qmark">'+(done?"✓":"·")+'</div><div class="c"><b>[['+esc(row.target)+']]</b> · '+esc(String(row.confidence))+" · "+esc(row.direction)+'</div><input type="text" class="qwhy" data-i="'+i+'" placeholder="why（留空 = 不批准）" value="'+esc(row.why)+'"'+(done?" disabled":"")+">"+(done?"":'<button data-a="link" data-i="'+i+'">保存并应用</button>')+"</div>"}
    var vd=row.verdict||"";var opts=["","冲突","细化","无关"].map(function(v){return '<option value="'+v+'"'+(v===vd?" selected":"")+">"+(v===""?"（待判）":v)+"</option>"}).join("");
    return '<div class="qrow'+(i===qSel?" on":"")+'"><div class="c"><b>旧：'+esc(row.oldName)+"</b> · 相似度 "+esc(String(row.score))+'</div><select class="qvd" data-i="'+i+'">'+opts+'</select><input type="text" class="qbs" data-i="'+i+'" placeholder="依据" value="'+esc(row.basis)+'"><button data-a="review" data-i="'+i+'">保存</button></div>'
  }).join("");qSel=Math.min(qSel,Math.max(0,item.rows.length-1));markQRow();if(qCur.kind==="review"&&item.rows.length)loadReviewTexts(item,qSel)}
function afterQueueChange(){renderQueueList();renderQueue()}
byId.qlist.addEventListener("click",function(e){var el=e.target.closest(".ditem");if(!el)return;qCur={kind:el.getAttribute("data-qk"),path:el.getAttribute("data-qp")};qSel=0;afterQueueChange()});
byId.qrows.addEventListener("click",async function(e){var btn=e.target.closest("button[data-a]");if(!btn){var rr=e.target.closest(".qrow");if(!rr||qCur.kind!=="review")return;var it0=findQueue(qCur.kind,qCur.path);if(!it0)return;var idx=Array.prototype.indexOf.call(byId.qrows.querySelectorAll(".qrow"),rr);if(idx<0)return;qSel=idx;markQRow();loadReviewTexts(it0,idx);return}var i=Number(btn.getAttribute("data-i"));var item=findQueue(qCur.kind,qCur.path);if(!item)return;btn.disabled=true;try{
  if(btn.getAttribute("data-a")==="link"){
    var input=byId.qrows.querySelector('.qwhy[data-i="'+i+'"]');var why=input?input.value.trim():"";
    if(!why){byId.qreport.textContent="why 为空：这一条不会被批准";return}
    var w=await (await fetch("/api/queue/link/why",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({path:item.path,index:i,why:why})})).json();
    if(!w.ok){byId.qreport.textContent="保存 why 失败："+(w.error||"");return}
    var r=await (await fetch("/api/queue/link/apply",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({path:item.path,confirm:true})})).json();
    byId.qreport.textContent="应用："+(r.applied||0)+" 条 · 仍待填 "+(r.pending||0)+" · 跳过 "+(r.skipped||0)+NL+(r.rows||[]).map(function(x){return (x.written?"写入 ":"跳过 ")+(x.note||"")+" ← [["+(x.target||"")+"]]"+(x.why?" — "+x.why:"")+(x.skipped?"（"+x.skipped+"）":"")}).join(NL);
    qQueues.links=(await (await fetch("/api/queues?kind=links")).json()).queues||qQueues.links;afterQueueChange();return
  }
  var sel=byId.qrows.querySelector('.qvd[data-i="'+i+'"]');var bs=byId.qrows.querySelector('.qbs[data-i="'+i+'"]');
  var v=await (await fetch("/api/queue/review/verdict",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({path:item.path,index:i,verdict:sel?sel.value:"",basis:bs?bs.value:""})})).json();
  if(!v.ok){byId.qreport.textContent="保存失败："+(v.error||"");return}
  byId.qreport.textContent="已保存判定："+((sel&&sel.value)||"（待判）");
  qQueues.review=(await (await fetch("/api/queues?kind=review")).json()).queues||qQueues.review;afterQueueChange()
}catch(err){byId.qreport.textContent="请求失败"}finally{btn.disabled=false}});
async function applyAllFilled(){var item=findQueue("links",qCur.path);if(qCur.kind!=="links"||!item){byId.qreport.textContent="先在左侧选一份链接队列";return}try{var r=await (await fetch("/api/queue/link/apply",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({path:item.path,confirm:true})})).json();byId.qreport.textContent="应用："+(r.applied||0)+" 条 · 仍待填 "+(r.pending||0)+" · 跳过 "+(r.skipped||0)+(r.warnings&&r.warnings.length?NL+r.warnings.join(NL):"");qQueues.links=(await (await fetch("/api/queues?kind=links")).json()).queues||qQueues.links;afterQueueChange()}catch(err){byId.qreport.textContent="应用失败"}}

byId.qarchive.onclick=async function(){if(!qCur.path){byId.qreport.textContent="先选一份队列";return}try{var r=await (await fetch("/api/queue/archive",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({kind:qCur.kind,path:qCur.path})})).json();if(!r.ok){byId.qreport.textContent="归档失败："+(r.error||"");return}byId.qreport.textContent="已归档到 "+r.to;qCur={kind:"",path:""};await loadQueues()}catch(err){byId.qreport.textContent="归档失败"}};
async function scanQueues(kind,limit){byId.qreport.textContent="扫描中（最多 "+limit+" 篇未处理笔记）…";try{var r=await (await fetch("/api/queue/scan",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({kind:kind,limit:limit})})).json();if(!r.ok){byId.qreport.textContent="扫描失败："+(r.error||"");return}byId.qreport.textContent=kind==="links"?("链接扫描：处理 "+r.notes+" 篇 · 候选 "+r.candidates+" · 排除 "+r.rejected+" · 队列 "+r.queues):("矛盾扫描：处理 "+r.notes+" 篇 · 待判 "+r.pending+" · 队列 "+r.queues);await loadQueues()}catch(err){byId.qreport.textContent="扫描失败"}}
byId.qscanreview.onclick=function(){scanQueues("review",5)};
var pCur="",pRows=[],curTab="notes";
function markPTree(p){Array.prototype.forEach.call(byId.tree.querySelectorAll(".note"),function(n){n.classList.toggle("on",n.getAttribute("data-p")===p)})}
async function selectPNote(p){pCur=p;markPTree(p);byId.ppath.textContent=p;byId.ptext.textContent="读取中…";byId.pcands.innerHTML="";byId.preport.textContent="";byId.phint.textContent="正在计算可能链接…";try{var j=await (await fetch("/api/note?path="+encodeURIComponent(p))).json();byId.ptext.textContent=j.ok?j.text:"读取失败："+(j.error||"")}catch(err){byId.ptext.textContent="读取失败"};await loadPossible()}
async function loadPossible(){if(pCur==="")return;byId.phint.textContent="正在计算可能链接…";try{var res=await fetch("/api/possible?path="+encodeURIComponent(pCur));var j=await res.json();if(!j.ok){byId.pcands.innerHTML="";byId.phint.textContent="计算失败："+(j.error||("HTTP "+res.status))+(res.status===404?"（KB 服务端还是旧版本：重启 DSH 后才会加载 /api/possible）":"");return}pRows=j.rows||[];renderPCands();byId.phint.textContent=pRows.length?("这些只是候选：写清「为什么该连」再点「加入关联」，才会写进这篇笔记的「## 关联」。（"+j.elapsedMs+" ms）"):(j.reason||"这篇笔记暂时没有相关候选。不需要凑链接。");if(j.warnings&&j.warnings.length)byId.preport.textContent=j.warnings.join(NL)}catch(err){byId.phint.textContent="计算失败"}}
function renderPCands(){byId.pcands.innerHTML=pRows.map(function(row,i){return '<div class="qrow"><div class="c"><b>[['+esc(row.target)+']]</b> · '+esc(String(row.confidence))+(row.direction?" · "+esc(row.direction):"")+(row.warning?" · "+esc(row.warning):"")+'</div><input type="text" class="pwhy" data-i="'+i+'" placeholder="why（写清为什么这两篇该连）"><button data-a="plink" data-i="'+i+'">加入关联</button></div>'}).join("")}
byId.prefresh.onclick=function(){loadPossible()};
byId.pcands.addEventListener("click",async function(e){var btn=e.target.closest("button[data-a=plink]");if(!btn)return;var i=Number(btn.getAttribute("data-i"));var row=pRows[i];if(!row)return;var input=byId.pcands.querySelector('.pwhy[data-i="'+i+'"]');var why=input?input.value.trim():"";if(!why){byId.preport.textContent="why 为空：这一条不写入（链接不是凑数量）";return}btn.disabled=true;try{var r=await (await fetch("/api/possible/apply",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({path:pCur,target:row.target,why:why})})).json();if(!r.ok){byId.preport.textContent="写入失败："+(r.error||"");btn.disabled=false;return}byId.preport.textContent="已写入 "+pCur+" → [["+row.target+"]]（备份 "+r.backup+"）";await selectPNote(pCur)}catch(err){byId.preport.textContent="写入失败";btn.disabled=false}});
load();
</script></html>
