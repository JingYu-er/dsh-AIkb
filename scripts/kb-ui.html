<!doctype html><html lang="zh"><meta charset="utf-8"><title>dsh-kb</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;font:14px/1.6 system-ui,"Segoe UI",sans-serif;background:#14161a;color:#e6e6e6;height:100vh;display:flex;flex-direction:column}
header{display:flex;gap:16px;align-items:center;padding:8px 14px;border-bottom:1px solid #2a2e36;flex:none}
header b{color:#9cc7ff;font-size:13px}header .tab{padding:5px 10px;border-radius:6px;cursor:pointer;color:#8b96a8}header .tab.on{background:#232833;color:#cfe3ff}
main{flex:1;display:flex;min-height:0}aside{width:280px;border-right:1px solid #2a2e36;overflow:auto;flex:none;padding:6px 0}
aside input{width:calc(100% - 16px);margin:4px 8px 8px;padding:6px 8px;background:#1b1f26;border:1px solid #333a45;border-radius:6px;color:#fff}
.note{padding:3px 12px;cursor:pointer;color:#c3ccda;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px}.note:hover{background:#1d222b}.note.on{background:#263041;color:#fff}
#pane{flex:1;display:flex;flex-direction:column;min-width:0}
#bar{display:flex;gap:8px;align-items:center;padding:6px 10px;border-bottom:1px solid #2a2e36;color:#8b96a8;font-size:12px;flex:none}
button{padding:5px 10px;border-radius:6px;border:1px solid #333a45;background:#232833;color:#cfe3ff;cursor:pointer}
textarea{flex:1;width:100%;border:0;background:#14161a;color:#dbe3ef;padding:14px 18px;font:13px/1.7 ui-monospace,Consolas,monospace;resize:none}
#search{display:none;flex:1;flex-direction:column;padding:12px 16px;overflow:auto}
#search input{width:100%;padding:8px 10px;background:#1b1f26;border:1px solid #333a45;border-radius:8px;color:#fff}
article{border:1px solid #2a2e36;border-radius:8px;padding:10px;margin:10px 0;background:#191d24}
.meta{font-size:12px;color:#8b96a8}.meta b{color:#9cc7ff}.ex{white-space:pre-wrap;color:#cfd6e2;margin-top:6px}
</style>
<header><b>dsh-kb</b><span class="tab on" id="t-notes">笔记</span><span class="tab" id="t-search">检索</span><span id="status" style="margin-left:auto;color:#7d8798;font-size:12px"></span></header>
<main>
  <aside><input id="filter" placeholder="过滤笔记…"><div id="tree"></div></aside>
  <div id="pane">
    <div id="bar"><span id="path">未选择笔记</span><span style="margin-left:auto"></span><button id="save" disabled>保存</button></div>
    <textarea id="editor" spellcheck="false" placeholder="从左侧选一篇笔记…"></textarea>
  </div>
  <div id="search"><input id="q" placeholder="检索书库（回车）"><div id="hits"></div></div>
</main>
<script>
var notes=[], current='', byId={
  tree:document.getElementById('tree'), editor:document.getElementById('editor'), path:document.getElementById('path'),
  save:document.getElementById('save'), status:document.getElementById('status'), filter:document.getElementById('filter'),
  q:document.getElementById('q'), hits:document.getElementById('hits'), search:document.getElementById('search'),
  pane:document.getElementById('pane'), tNotes:document.getElementById('t-notes'), tSearch:document.getElementById('t-search')
};
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;')}
function render(){
  var f=byId.filter.value.toLowerCase();
  var items=notes.filter(function(n){return f===''||n.toLowerCase().indexOf(f)>=0});
  if(items.length>400)items=items.slice(0,400);
  byId.tree.innerHTML=items.map(function(n){
    return '<div class="note'+(n===current?' on':'')+'" data-p="'+esc(n)+'">'+esc(n)+'</div>';
  }).join('');
}
byId.tree.addEventListener('click',function(e){
  var el=e.target.closest('.note'); if(!el)return; openNote(el.getAttribute('data-p'));
});
async function openNote(p){
  current=p; render();
  var r=await fetch('/api/note?path='+encodeURIComponent(p)); var j=await r.json();
  if(!j.ok){byId.status.textContent='读取失败';return}
  byId.path.textContent=p; byId.editor.value=j.text; byId.save.disabled=false; byId.status.textContent='';
}
byId.save.onclick=async function(){
  var r=await fetch('/api/save',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({path:current,text:byId.editor.value})});
  var j=await r.json(); byId.status.textContent=j.ok?'已保存':'保存失败';
};
byId.filter.oninput=render;
async function load(){
  var r=await fetch('/api/notes'); var j=await r.json();
  if(!j.ok){byId.status.textContent='加载失败';return}
  notes=j.notes||[]; byId.status.textContent=notes.length+' 篇笔记'; render();
}
byId.tNotes.onclick=function(){byId.tNotes.classList.add('on');byId.tSearch.classList.remove('on');byId.pane.style.display='flex';byId.search.style.display='none'};
byId.tSearch.onclick=function(){byId.tSearch.classList.add('on');byId.tNotes.classList.remove('on');byId.search.style.display='flex';byId.pane.style.display='none'};
byId.q.addEventListener('keydown',async function(e){
  if(e.key!=='Enter')return; var text=byId.q.value.trim(); if(!text)return;
  byId.hits.textContent='检索中…';
  var r=await fetch('/api/query?q='+encodeURIComponent(text)+'&k=8'); var j=await r.json();
  if(!j.ok){byId.hits.textContent='出错：'+j.error;return}
  byId.hits.innerHTML=j.hits.map(function(h){
    var pages='p.'+(h.pageStart||h.page)+(h.pageEnd&&h.pageEnd!==h.page?'-'+h.pageEnd:'');
    return '<article><div class="meta"><b>'+esc(h.path)+'</b> · §'+esc(h.section||'—')+' · '+pages+' · '+h.score+'</div><div class="ex">'+esc(h.excerpt)+'</div></article>';
  }).join('')||'没有命中';
});
load();
</script></html>
